# -- Image. Prefer `digest` (immutable) over `tag`; the CD promotion job sets both.
image:
  repository: ghcr.io/gastonhp1/demo-api
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2

env: dev
logLevel: info

serviceAccount:
  create: true
  # Workload Identity client ID, only needed if the app itself talks to Azure.
  workloadIdentityClientId: ""

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# -- Exposed through the shared Gateway (Gateway API) owned by the platform.
httpRoute:
  enabled: true
  hostnames: []
  parentRef:
    name: public
    namespace: envoy-gateway-system
    sectionName: https

networkPolicy:
  enabled: true
  # Namespaces allowed to reach the pods (gateway data plane + Prometheus).
  allowFromNamespaces:
    - envoy-gateway-system
    - monitoring

serviceMonitor:
  enabled: true
  interval: 30s

# -- Pull a secret from Key Vault through External Secrets Operator.
externalSecret:
  enabled: false
  secretStore: azure-keyvault
  refreshInterval: 1h
  data:
    - envVar: DEMO_API_KEY
      remoteKey: demo-api-key

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []

topologySpreadConstraints:
  enabled: true
