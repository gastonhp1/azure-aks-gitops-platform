env: local

# -- Images, published and signed to GHCR by the CI of github.com/gastonhp1/Pharmatrace
# (backend) and github.com/gastonhp1/PharmaTrace-UI (ui) through the golden-path
# reusable workflow. Prefer `digest` over `tag` when set.
images:
  backend:
    repository: ghcr.io/gastonhp1/pharmatrace-api
    tag: ""
    digest: ""
  ui:
    repository: ghcr.io/gastonhp1/pharmatrace-ui
    tag: ""
    digest: ""
pullPolicy: IfNotPresent

# -- The Hyperledger Fabric network the API talks to. It is not part of this chart: it runs
# from fabric/helm/pharmatrace-network in the Pharmatrace repo (locally: `make pharmatrace-fabric`),
# whose bootstrap (CAs, identities, channel, chaincode) is imperative.
fabric:
  # Namespace of the network; the API reaches peer0-<org>.<namespace>.svc.cluster.local:7051.
  namespace: pharmatrace-fabric
  channel: pharmatrace
  chaincode: pharmatrace
  # Secret with the API's identities (scripts/pharmatrace-fabric-identities.sh). Never in git.
  identitiesSecret: pharmatrace-fabric-identities
  # Org -> users the API acts as. The API is custodial: one identity per org.
  identities:
    lab: [User1]
    dist: [User1, IotGateway]
    farma: [User1]
    reg: [User1]

backend:
  # <org>:<user> that anchors IoT readings; its certificate carries pharmatrace.role=iot-gateway.
  iotGatewayIdentity: "dist:IotGateway"
  # Skip the x-api-key check on writes. Local only: the UI has no way to keep a key secret.
  authDisabled: false
  # Secret with an API_KEY entry, required when authDisabled is false.
  apiKeySecret: ""
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

ui:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

# -- UI on / and the API on /api under the same hostname, through the shared Gateway.
httpRoute:
  enabled: true
  hostnames: []
  parentRef:
    name: public
    namespace: envoy-gateway-system
    sectionName: https

networkPolicy:
  enabled: true
  # Namespaces allowed to reach the UI and the API (gateway data plane).
  allowFromNamespaces:
    - envoy-gateway-system

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
