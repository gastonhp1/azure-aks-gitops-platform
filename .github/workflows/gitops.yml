name: gitops

on:
  pull_request:
    paths: ["gitops/**", "charts/**", ".github/workflows/gitops.yml"]
  push:
    branches: [main]
    paths: ["gitops/**", "charts/**"]

permissions:
  contents: read

jobs:
  validate:
    name: helm / kustomize / kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: install kustomize + kubeconform
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz | tar xz -C /usr/local/bin kustomize
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform

      - name: helm lint + schema (every env)
        run: make helm-lint

      - name: kustomize build + schema (every cluster)
        run: make manifests

      - name: no rendered values for local leaked into base
        run: |
          # Placeholders must only be rendered inside gitops/clusters/<env> and values-<env>.yaml.
          ! grep -rn "__[A-Z_]*__" gitops/addons gitops/config charts

  diff:
    name: rendered diff vs base branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: render base and head, write diff to the job summary
        run: |
          git worktree add -q ../base "origin/${{ github.base_ref }}"
          for env in dev prod; do
            helm template demo-api charts/demo-api -f "gitops/apps/demo-api/values-$env.yaml" > "/tmp/head-$env.yaml"
            (cd ../base && helm template demo-api charts/demo-api -f "gitops/apps/demo-api/values-$env.yaml") > "/tmp/base-$env.yaml" || : > "/tmp/base-$env.yaml"
            {
              echo "### demo-api ($env)"
              echo '```diff'
              diff -u "/tmp/base-$env.yaml" "/tmp/head-$env.yaml" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
