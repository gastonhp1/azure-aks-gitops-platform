# Local stand-in for AKS: 1 control plane + 2 workers labelled with fake zones
# so topology spread constraints behave like they do in a zonal cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform-local
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
