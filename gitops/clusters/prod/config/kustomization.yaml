apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../config/azure
patches:
  - target:
      kind: Gateway
      name: public
    patch: |-
      - op: replace
        path: /spec/listeners/0/hostname
        value: "demo.__DOMAIN__"
      - op: replace
        path: /spec/listeners/1/hostname
        value: "demo.__DOMAIN__"
  - target:
      kind: ClusterSecretStore
      name: azure-keyvault
    patch: |-
      - op: replace
        path: /spec/provider/azurekv/vaultUrl
        value: "__VAULT_URL__"
  - target:
      kind: ClusterIssuer
      name: default-issuer
    patch: |-
      - op: replace
        path: /spec/acme/email
        value: "__ACME_EMAIL__"
  # prod blocks non-compliant pods and unsigned images instead of auditing.
  - target:
      kind: ClusterPolicy
      name: pod-security-restricted
    patch: |-
      - op: replace
        path: /spec/rules/0/validate/failureAction
        value: Enforce
  - target:
      kind: ClusterPolicy
      name: verify-image-signatures
    patch: |-
      - op: replace
        path: /spec/rules/0/verifyImages/0/failureAction
        value: Enforce
      - op: replace
        path: /spec/rules/0/verifyImages/0/mutateDigest
        value: true
