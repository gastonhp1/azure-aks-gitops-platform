# Key Vault backend for External Secrets, authenticated with Workload Identity
# (the external-secrets service account is federated in Terraform).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: PLACEHOLDER_VAULT_URL
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
