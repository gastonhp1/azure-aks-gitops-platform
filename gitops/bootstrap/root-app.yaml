# App-of-apps entry point. `make argocd CLUSTER=<local|dev|prod>` applies this
# file with CLUSTER substituted; everything else is pulled from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gastonhp1/azure-aks-gitops-platform.git
    targetRevision: main
    path: gitops/clusters/${CLUSTER}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
