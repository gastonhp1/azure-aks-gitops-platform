# Pod Security "restricted" profile for every non-system namespace.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-security-restricted
  annotations:
    policies.kyverno.io/title: Pod Security Standards (restricted)
    policies.kyverno.io/severity: high
spec:
  background: true
  rules:
    - name: restricted
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - monitoring # node-exporter needs host access
                - envoy-gateway-system
      validate:
        failureAction: Audit # Enforce in prod (cluster overlay)
        podSecurity:
          level: restricted
          version: latest
---
# Only run images that secure-cicd-golden-path built and signed (Sigstore
# keyless: the signing identity is the reusable workflow itself).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Cosign keyless signatures
    policies.kyverno.io/severity: high
spec:
  webhookTimeoutSeconds: 30
  rules:
    - name: signed-by-golden-path
      match:
        any:
          - resources:
              kinds: ["Pod"]
      verifyImages:
        - imageReferences:
            - "ghcr.io/gastonhp1/*"
            - "*.azurecr.io/*"
          failureAction: Audit # Enforce in prod (cluster overlay)
          mutateDigest: false # Kyverno only allows true with Enforce (prod overlay)
          verifyDigest: true
          required: true
          # The certificate subject is the reusable workflow, which is public: any
          # GitHub repo can call it and get a signature with that subject. So each
          # entry also pins the repo the workflow ran in (Fulcio's GitHub Workflow
          # Repository extension, exact match). Onboarding an app = adding its repo.
          attestors:
            - count: 1 # any one entry
              entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subjectRegExp: "^https://github\\.com/gastonhp1/secure-cicd-golden-path/\\.github/workflows/reusable-container\\.yml@refs/(heads/main|tags/v.*)$"
                    additionalExtensions:
                      githubWorkflowRepository: gastonhp1/secure-cicd-golden-path # demo-api
                    rekor:
                      url: https://rekor.sigstore.dev
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subjectRegExp: "^https://github\\.com/gastonhp1/secure-cicd-golden-path/\\.github/workflows/reusable-container\\.yml@refs/(heads/main|tags/v.*)$"
                    additionalExtensions:
                      githubWorkflowRepository: gastonhp1/Pharmatrace # pharmatrace-chain, pharmatrace-api
                    rekor:
                      url: https://rekor.sigstore.dev
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subjectRegExp: "^https://github\\.com/gastonhp1/secure-cicd-golden-path/\\.github/workflows/reusable-container\\.yml@refs/(heads/main|tags/v.*)$"
                    additionalExtensions:
                      githubWorkflowRepository: gastonhp1/PharmaTrace-UI # pharmatrace-ui
                    rekor:
                      url: https://rekor.sigstore.dev
---
# verify-image-signatures only checks images from the registries it lists; an
# image from anywhere else (docker.io/..., quay.io/...) is never verified. This
# closes that: outside the platform namespaces, every container must come from
# a registry the signature policy covers. Together: allowed registry + signed
# by golden-path from an allowlisted repo.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict image registries
    policies.kyverno.io/severity: high
spec:
  background: true
  rules:
    - name: signed-registries-only
      match:
        any:
          - resources:
              kinds: ["Pod"]
      # Platform add-ons pull their upstream images (quay.io, registry.k8s.io,
      # docker.io, ...). Any other namespace, including new ones, is restricted.
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - kyverno
                - argocd
                - cert-manager
                - external-secrets
                - envoy-gateway-system
                - monitoring
      validate:
        failureAction: Audit # Enforce in prod (cluster overlay)
        message: >-
          Images must come from ghcr.io/gastonhp1/ or an Azure Container Registry
          (*.azurecr.io), where verify-image-signatures checks their signature.
        pattern:
          spec:
            =(ephemeralContainers):
              - image: "ghcr.io/gastonhp1/* | *.azurecr.io/*"
            =(initContainers):
              - image: "ghcr.io/gastonhp1/* | *.azurecr.io/*"
            containers:
              - image: "ghcr.io/gastonhp1/* | *.azurecr.io/*"
