{{- $name := printf "%s-api" (include "pharmatrace.fullname" .) }}
{{- if and (not .Values.backend.authDisabled) (not .Values.backend.apiKeySecret) }}
{{- fail "backend.apiKeySecret is required unless backend.authDisabled is true" }}
{{- end }}
{{- $fabric := .Values.fabric }}
{{- $orgsDir := "/fabric/organizations" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "pharmatrace.labels" (list . "api") | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "pharmatrace.selectorLabels" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pharmatrace.selectorLabels" (list . "api") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "pharmatrace.image" .Values.images.backend }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: PORT
              value: "3001"
            - name: FABRIC_ORGS_DIR
              value: {{ $orgsDir }}
            - name: FABRIC_CHANNEL
              value: {{ $fabric.channel | quote }}
            - name: FABRIC_CHAINCODE
              value: {{ $fabric.chaincode | quote }}
            # Each org's identities talk to that org's peer (Fabric Gateway). The TLS
            # name checked is still peer0.<org>.pharmatrace.ar, which the certificates carry.
            {{- range $org, $users := $fabric.identities }}
            - name: FABRIC_PEER_ENDPOINT_{{ upper $org }}
              value: {{ printf "peer0-%s.%s.svc.cluster.local:7051" $org $fabric.namespace | quote }}
            {{- end }}
            {{- with .Values.backend.iotGatewayIdentity }}
            - name: IOT_GATEWAY_IDENTITY
              value: {{ . | quote }}
            {{- end }}
            - name: UNLOCK_AUDIT_FILE
              value: /tmp/unlock-audit.jsonl
            {{- if .Values.backend.authDisabled }}
            - name: AUTH_DISABLED
              value: "true"
            {{- else }}
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.apiKeySecret }}
                  key: API_KEY
            {{- end }}
            {{- with .Values.backend.authSecret }}
            # Mobile app login and PharmaBox unlock (scripts/pharmatrace-auth.sh). Without it
            # /api/auth and /api/box answer 503.
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: session-secret
            - name: USERS_FILE
              value: /etc/pharmatrace/auth/users.json
            - name: UNLOCK_KEY_FILE
              value: /etc/pharmatrace/auth/unlock-key.pem
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: fabric-identities
              mountPath: {{ $orgsDir }}
              readOnly: true
            {{- if .Values.backend.authSecret }}
            # A directory mount (not subPath), so user changes reach the pod without a restart.
            - name: auth
              mountPath: /etc/pharmatrace/auth
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- with .Values.backend.authSecret }}
        - name: auth
          secret:
            secretName: {{ . }}
            defaultMode: 0440
            items:
              - key: users.json
                path: users.json
              - key: unlock-key.pem
                path: unlock-key.pem
        {{- end }}
        # The API's Fabric identities, laid out as fabric/network/organizations. Created outside
        # git from the network's material (scripts/pharmatrace-fabric-identities.sh); keys are
        # <org>.<User>.cert.pem, <org>.<User>.key.pem and <org>.tlsca.crt.
        - name: fabric-identities
          secret:
            secretName: {{ $fabric.identitiesSecret }}
            defaultMode: 0440
            items:
              {{- range $org, $users := $fabric.identities }}
              {{- $d := printf "%s.pharmatrace.ar" $org }}
              - key: {{ $org }}.tlsca.crt
                path: peerOrganizations/{{ $d }}/peers/peer0.{{ $d }}/tls/ca.crt
              {{- range $user := $users }}
              - key: {{ $org }}.{{ $user }}.cert.pem
                path: peerOrganizations/{{ $d }}/users/{{ $user }}@{{ $d }}/msp/signcerts/cert.pem
              - key: {{ $org }}.{{ $user }}.key.pem
                path: peerOrganizations/{{ $d }}/users/{{ $user }}@{{ $d }}/msp/keystore/key.pem
              {{- end }}
              {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "pharmatrace.labels" (list . "api") | nindent 4 }}
spec:
  selector:
    {{- include "pharmatrace.selectorLabels" (list . "api") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
