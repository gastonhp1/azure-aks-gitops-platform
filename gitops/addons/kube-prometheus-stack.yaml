apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.19.0
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        # AKS manages the control plane: these targets are not scrapeable.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false # Cilium data plane, no kube-proxy
        prometheus:
          prometheusSpec:
            retention: 3d
            retentionSize: 8GB
            # Pick up ServiceMonitors from every namespace that carry this label.
            serviceMonitorSelector:
              matchLabels:
                release: kube-prometheus-stack
            serviceMonitorNamespaceSelector: {}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
        grafana:
          defaultDashboardsTimezone: America/Argentina/Buenos_Aires
          admin:
            existingSecret: "" # dev: chart-generated password; prod: patched to an ExternalSecret
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
        alertmanager:
          alertmanagerSpec:
            retention: 72h
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRDs are too large for client-side apply annotations
