# Argo CD manages its own upgrades (bump targetRevision via PR / Renovate).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 9.7.1
      helm:
        releaseName: argocd
        valueFiles:
          - $repo/gitops/bootstrap/argocd-values.yaml
    - repoURL: https://github.com/gastonhp1/azure-aks-gitops-platform.git
      targetRevision: main
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false # never let a bad commit prune the controller itself
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
